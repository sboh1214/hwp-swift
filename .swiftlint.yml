included: # paths to include during linting. `--path` is ignored if present.
  - Sources
  - Tests
  - Package.swift

excluded:
  - Carthage
  - Pods
  - .build
  # 로컬 전용 진단 스크래치 (.gitignore 대상이라 CI 체크아웃엔 없다).
  # 짧은 진단 변수명·긴 print 덤프가 본질이라 프로덕션 규칙 대상이 아니다.
  - Tests/HwpKitTests/FixturePreviewDumpScratch.swift

disabled_rules:
  - todo
  - trailing_comma
  - opening_brace

line_length:
  warning: 100
  error: 120

identifier_name:
  excluded:
    - id
    - x
    - y

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 500
  error: 700

custom_rules:
  no_xctassert:
    name: "No XCTAssert"
    regex: "(XCTAssert)"
    match_kinds:
      - comment
      - identifier
    message: "Use Nimble expect ~ to be ~ pattern"
    severity: error

# reporter type (xcode, json, csv, checkstyle, junit, html, emoji, sonarqube, markdown, github-actions-logging)
reporter: "xcode"
