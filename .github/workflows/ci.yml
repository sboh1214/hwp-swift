name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        run: |
          swift --version
          swift test --enable-code-coverage
      - name: Export lcov
        # Release 번들은 커버리지 매핑이 없고 Debug-iphonesimulator 번들은 바이너리가
        # 번들 루트에 있어 어느 쪽을 고르든 export가 실패한다. macOS Debug 산출물만
        # 후보로 남긴 뒤 SF 레코드가 가장 많은 번들 하나를 골라 단독 export한다 —
        # 공유 경로의 수치는 어느 번들로 뽑아도 같고, 번들마다 다른 것은 레코드의 유무다.
        run: |
          set -euo pipefail
          PROF_DATA=$(find .build -name 'default.profdata' -type f | head -1)
          CANDIDATES=$(find .build -name '*.xctest' -type d | grep -E '/(Debug|debug)/' || true)
          if [ -z "$CANDIDATES" ]; then
            echo "No Debug XCTest bundle found" >&2
            exit 1
          fi
          CANDIDATE_LCOV=$(mktemp)
          BEST_BUNDLE=""
          BEST_COUNT=0
          while IFS= read -r BUNDLE; do
            BIN_NAME=$(basename "$BUNDLE" .xctest)
            BINARY="$BUNDLE/Contents/MacOS/$BIN_NAME"
            if [ ! -x "$BINARY" ]; then
              echo "Skipping $BUNDLE: no executable test binary" >&2
              continue
            fi
            if ! xcrun llvm-cov export -format=lcov "$BINARY" \
              -instr-profile="$PROF_DATA" \
              -ignore-filename-regex='(\.build|Tests/)' \
              > "$CANDIDATE_LCOV"; then
              echo "Skipping $BUNDLE: no coverage data" >&2
              continue
            fi
            COUNT=$(grep -c '^SF:' "$CANDIDATE_LCOV" || true)
            echo "$BUNDLE: $COUNT source files"
            if [ "$COUNT" -gt "$BEST_COUNT" ]; then
              BEST_COUNT=$COUNT
              BEST_BUNDLE=$BUNDLE
              cp "$CANDIDATE_LCOV" coverage.lcov
            fi
          done <<< "$CANDIDATES"
          if [ -z "$BEST_BUNDLE" ]; then
            echo "No coverage-instrumented test bundle found" >&2
            exit 1
          fi
          echo "Selected $BEST_BUNDLE ($BEST_COUNT source files)"
      - name: Enforce coverage thresholds
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 임계가 None인 경로는 값만 기록하고 실패시키지 않는다 (#106)
          targets = [
              ("Sources/CoreHwp/", 95.0),
              ("Sources/HwpKitCore/", 91.0),
              ("Sources/HwpKitNative/", None),
              ("Sources/HwpKit/", None),
          ]

          totals = {path: [0, 0] for path, _ in targets}
          current = None

          for line in Path("coverage.lcov").read_text(encoding="utf-8").splitlines():
              if line.startswith("SF:"):
                  current = next((path for path, _ in targets if path in line), None)
              elif current and line.startswith("LF:"):
                  totals[current][0] += int(line.removeprefix("LF:"))
              elif current and line.startswith("LH:"):
                  totals[current][1] += int(line.removeprefix("LH:"))
              elif line == "end_of_record":
                  current = None

          failures = []
          for path, threshold in targets:
              total_lines, hit_lines = totals[path]
              if total_lines == 0:
                  failures.append(f"No {path} coverage records found in coverage.lcov")
                  continue
              coverage = hit_lines * 100 / total_lines
              print(f"{path} line coverage: {coverage:.2f}% ({hit_lines}/{total_lines})")
              if threshold is not None and coverage < threshold:
                  failures.append(f"{path} line coverage {coverage:.2f}% is below {threshold:.2f}%")

          if failures:
              raise SystemExit("\n".join(failures))
          PY
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.lcov
          fail_ci_if_error: false

  test-ios:
    name: Test (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select simulator
        id: sim
        # 러너 이미지마다 설치된 기기명이 달라 첫 iPhone을 동적으로 고른다
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available \
            | grep -E '^\s+iPhone' | head -1 \
            | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            echo "no available iPhone simulator" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Run package tests on iOS Simulator
        # **패키지**의 #if os(iOS) 코드 (HwpDocumentUIView 계열)는 이 잡에서만
        # 컴파일·실행된다 (샘플 앱의 #if os(iOS)는 build-sample 잡이 본다)
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Hwp-Swift-Package \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -quiet

  test-linux:
    name: Test (Linux, Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "5.9"
            image: swift:5.9-jammy
          - swift: "6.3"
            image: swift:6.3-noble
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        run: |
          swift --version
          swift test

  build-sample:
    name: Build (Sample app)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # 패키지 테스트(`swift test`)는 샘플 앱을 컴파일조차 하지 않는다 — 샘플만
      # 깨뜨리는 변경을 잡는 곳은 여기뿐이다.
      # 스킴은 공유되어 있지 않지만 xcodebuild가 타깃마다 자동 생성하므로
      # 신선한 체크아웃에서도 `-scheme`으로 잡힌다 (`-target`은 패키지 의존성이
      # 풀리지 않아 쓸 수 없다).
      - name: Build for macOS
        run: |
          set -o pipefail
          xcodebuild -project Sample/HwpSwiftSample.xcodeproj \
            -scheme HwpSwiftSample \
            -destination 'platform=macOS' \
            -configuration Debug build
      # 목적지에 기기명을 박지 않는다 — 러너 이미지마다 설치된 시뮬레이터가
      # 달라서다 (test-ios가 UDID를 동적으로 고르는 것과 같은 이유). 빌드는
      # 부팅된 기기가 필요 없으므로 generic으로 충분하다.
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project Sample/HwpSwiftSample.xcodeproj \
            -scheme HwpSwiftSample \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug build
      # 빌드만으로는 **xcodegen 재생성 누락을 못 잡는다**: 생성된 pbxproj가
      # 파일을 명시 참조하므로, 등록되지 않은 새 .swift는 컴파일 대상에서 통째로
      # 빠져 문법 오류가 있어도 빌드가 성공한다 (실측). 그래서 재생성 결과를
      # 따로 대조한다 — `Sample/README.md`가 "재생성 결과를 같은 커밋에 넣어야
      # 한다"고 못박은 규율의 기계 검사다.
      #
      # 두 가지에 의존한다: (1) 체크아웃 디렉터리 이름 — 생성되는 로컬 패키지
      # 참조 이름이 그 디렉터리에서 오고, Actions는 `<repo>/<repo>`에 받는다.
      # (2) xcodegen 버전 — brew 최신을 쓰므로 생성기 출력 형식이 바뀌면 무관한
      # PR에서도 이 스텝이 빨개진다. 그래서 이 잡은 필수 체크가 아니다.
      - name: Check xcodegen drift
        run: |
          set -euo pipefail
          brew install xcodegen
          (cd Sample && xcodegen generate)
          git diff --exit-code Sample/HwpSwiftSample.xcodeproj/project.pbxproj

  lint:
    name: Lint
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # 이 라이브러리는 폰트를 동봉하지 않는다 (README "폰트"). pre-commit 훅은
      # 로컬 커밋만 막으므로 훅 미설치 기여자·웹 UI 업로드는 여기서 걸러낸다.
      - name: No font binaries
        run: |
          files=$(git ls-files | grep -iE '\.(ttf|otf|ttc|woff2?)$' || true)
          if [ -n "$files" ]; then
            echo "::error::폰트 바이너리가 저장소에 포함되어 있습니다:"
            echo "$files"
            exit 1
          fi
      - name: Install tools
        run: brew install swiftformat swiftlint
      - name: SwiftFormat
        run: swiftformat --lint .
      - name: SwiftLint
        # 범위는 인자가 아니라 `.swiftlint.yml`의 `included`가 정한다 —
        # `Sample/`도 거기 들어 있다 (#140).
        run: swiftlint
