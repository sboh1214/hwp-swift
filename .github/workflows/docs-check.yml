name: Docs Check

on:
  pull_request:
    branches: [main]
    paths:
      - "Sources/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/pages/**"
      - ".github/actions/build-docs-site/**"
      - ".github/workflows/docs-check.yml"
      - ".github/workflows/cd.yml"

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Build DocC (PR check)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-docs-site
