name: HwpSwiftSample
options:
  bundleIdPrefix: dev.sboh
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  hwp-swift:
    path: ..

targets:
  HwpSwiftSample:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: HwpSwiftSample
    dependencies:
      - package: hwp-swift
        product: HwpKit
      - package: hwp-swift
        product: HwpKitCore
    entitlements:
      path: HwpSwiftSample/HwpSwiftSample.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # PDF 내보내기가 저장 패널로 고른 위치에 쓰므로 read-only로는 부족하다
        # (Powerbox가 read-only 엔타이틀먼트에는 쓰기 권한을 주지 않는다).
        com.apple.security.files.user-selected.read-write: true
        # 샌드박스 앱이 인쇄 서비스에 접근하려면 이 캐퍼빌리티가 따로 필요하다
        # (Xcode의 App Sandbox > Hardware > Printing). 위 파일 엔타이틀먼트는
        # 파일 접근만 주므로, 없으면 macOS 인쇄가 **조용히** 실패한다 —
        # `NSPrintOperation.run()`의 Bool은 취소와 실패를 구분하지 않아
        # 사유를 올리지 않기 때문이다 (`PDFExportSupport.swift`).
        com.apple.security.print: true
        # 최근 문서 목록(#126)이 보안 범위 북마크를 만들려면 app-scope 북마크
        # 엔타이틀먼트가 따로 필요하다 — 파일 엔타이틀먼트는 그 세션의 접근만
        # 주고, 없으면 북마크 생성이 조용히 실패해 목록이 영영 비어 있다.
        com.apple.security.files.bookmarks.app-scope: true
    info:
      path: HwpSwiftSample/Info.plist
      properties:
        CFBundleDisplayName: HwpSwiftSample
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleDocumentTypes:
          - CFBundleTypeName: HWP Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [dev.sboh.hwp]
          - CFBundleTypeName: HWPX Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [dev.sboh.hwpx]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: dev.sboh.hwp
            UTTypeDescription: HWP Document
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [hwp]
          - UTTypeIdentifier: dev.sboh.hwpx
            UTTypeDescription: HWPX Document
            # 컨테이너가 ZIP이어도 `public.zip-archive`에 적합시키지 않는다 —
            # 그러면 iOS Files가 .hwpx를 아카이브로 보고 탭 시 압축 해제하며
            # macOS '다음으로 열기' 후보에 Archive Utility가 낀다 (시뮬레이터·
            # 프로브 앱 실측). docx/epub·한컴의 hwpx UTI처럼 문서 UTI는
            # `public.data`만 적합하고, ZIP 감지는 파서(`HwpFile`)의 바이트
            # 스니핑이 맡는다.
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [hwpx]
        UILaunchScreen:
          UIColorName: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sboh.HwpSwiftSample
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
