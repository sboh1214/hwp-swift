name: HwpSwiftSample
options:
  bundleIdPrefix: dev.sboh
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  hwp-swift:
    path: ..

targets:
  HwpSwiftSample:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: HwpSwiftSample
    dependencies:
      - package: hwp-swift
        product: HwpKit
      - package: hwp-swift
        product: HwpKitCore
    entitlements:
      path: HwpSwiftSample/HwpSwiftSample.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # PDF 내보내기가 저장 패널로 고른 위치에 쓰므로 read-only로는 부족하다
        # (Powerbox가 read-only 엔타이틀먼트에는 쓰기 권한을 주지 않는다).
        com.apple.security.files.user-selected.read-write: true
    info:
      path: HwpSwiftSample/Info.plist
      properties:
        CFBundleDisplayName: HwpSwiftSample
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleDocumentTypes:
          - CFBundleTypeName: HWP Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [dev.sboh.hwp]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: dev.sboh.hwp
            UTTypeDescription: HWP Document
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [hwp]
        UILaunchScreen:
          UIColorName: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sboh.HwpSwiftSample
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
